<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fonnte Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #334155;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            border: 1px solid #e2e8f0;
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 25px;
        }
        .form-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 6px;
        }
        .form-control, .form-select {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 0.95rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }
        .btn-fonnte {
            background-color: #1e3a8a;
            color: #ffffff;
            font-weight: 500;
            border-radius: 6px;
            padding: 11px;
            font-size: 0.95rem;
            width: 100%;
            border: none;
            transition: all 0.2s;
        }
        .btn-fonnte:hover {
            background-color: #172554;
            color: #ffffff;
        }
        .back-link {
            color: #64748b;
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: inline-block;
        }
        .back-link:hover {
            color: #1e293b;
        }
        .support-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: #1e3a8a;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 24px;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.3);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }
        .support-btn:hover {
            color: #fff;
            background-color: #172554;
        }
    </style>
</head>
<body>

    <div class="w-100" style="max-width: 420px;">
        <a href="/" class="back-link"><i class="bi bi-arrow-left me-1"></i> Back to homepage</a>
        
        <div class="login-card">
            <h3 class="login-title">Login</h3>
            
            <div id="login-alert" class="alert alert-danger py-2 small d-none"></div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label">Your Account</label>
                    <input type="text" class="form-control" id="account" placeholder="Masukkan akun admin" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Your Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Password (opsional jika token benar)">
                </div>

                <div class="mb-3">
                    <label class="form-label">Country</label>
                    <select class="form-select" id="country">
                        <option value="62" selected>Indonesia (+62)</option>
                        <option value="1">United States (+1)</option>
                        <option value="60">Malaysia (+60)</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember" checked>
                        <label class="form-check-label small text-muted" for="remember">Remember me</label>
                    </div>
                    <a href="#" class="small text-decoration-none text-primary" onclick="alert('Hubungi administrator server untuk reset kredensial.')">Lost password?</a>
                </div>

                <button type="submit" class="btn btn-fonnte mb-3" id="btn-submit">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Login
                </button>

                <div class="text-center mb-3">
                    <span class="text-muted small">OR</span>
                </div>

                <a href="/auth/google" class="btn btn-outline-dark w-100 py-2 d-flex align-items-center justify-content-center gap-2" style="border-radius: 6px; font-weight: 500;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                    Sign in with Google (Multi-User Server)
                </a>

                <div class="text-center mt-4">
                    <span class="small text-muted">Don't have an account?</span>
                    <a href="#" class="small text-decoration-none text-primary ms-1" onclick="alert('Daftarkan admin key baru di file .admin.env server')">Create account</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Floating Support Button -->
    <a href="javascript:void(0)" class="support-btn" onclick="alert('rapiuw-sms Platform Support\nHubungi admin server untuk bantuan teknis.')">
        <i class="bi bi-question-circle"></i> Support
    </a>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const account = document.getElementById('account').value.trim();
            const btn = document.getElementById('btn-submit');
            const alertDiv = document.getElementById('login-alert');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Logging in...';
            alertDiv.classList.add('d-none');

            try {
                // Verifikasi admin token ke server /api/stats
                const res = await fetch('/api/stats', {
                    headers: { 'x-admin-token': account }
                });

                if (res.status === 200) {
                    localStorage.setItem('admin_token', account);
                    window.location.href = '/dashboard';
                } else {
                    alertDiv.innerText = 'Token atau akun tidak valid. Cek .admin.env Anda.';
                    alertDiv.classList.remove('d-none');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Login';
                }
            } catch (err) {
                alertDiv.innerText = 'Gagal menghubungi server: ' + err.message;
                alertDiv.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Login';
            }
        }
    </script>
</body>
</html>
